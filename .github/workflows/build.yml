name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/tracker.keystore; else echo "No KEYSTORE_BASE64 secret, using random debug key"; fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GpsTracker-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare release file
        run: cp app/build/outputs/apk/debug/app-debug.apk GpsTracker.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VER}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" GpsTracker.apk --title "GPS Трекер $VER (сборка $GITHUB_RUN_NUMBER)" --notes "Коммит ${GITHUB_SHA::7}" --latest
